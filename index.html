<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Pol Esteba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* Palette taken from Pol's black-and-white photo: neutral greys, deep black, and the warm tone of the candle bokeh as the only accent. */
:root{
  --bg:#EEEDEA; --ink:#0E0E0D; --dark:#161615; --paper:#D7D6D2; --line:#C6C5C0; --muted:#6A6965;
  --acc:#7D6646; --acc-l:#CDB48C; --red:#C8102E; --cream:#EEEDEA; --soft:#BDBCB7;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --f-serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --gut:clamp(16px,5.5vw,80px);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;padding:0;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.wrap{width:100%;max-width:1440px;margin-inline:auto;padding-inline:var(--gut)}
h1,h2,h3,p{margin:0}
.display{font-weight:800;letter-spacing:-.055em;line-height:.94;text-wrap:balance}

/* cursor light */
#glow{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;pointer-events:none;z-index:90;opacity:0;transition:opacity .35s ease;
  background:radial-gradient(circle,rgba(222,196,150,.46) 0%,rgba(205,180,140,.20) 34%,rgba(205,180,140,0) 68%);will-change:transform}
#glow::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#111110;box-shadow:0 0 0 2px rgba(238,237,234,.8)}
@media (hover:none){#glow,#dot{display:none}}
#glow::after{display:none}
#dot{position:fixed;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#111110;box-shadow:0 0 0 2px rgba(238,237,234,.8);pointer-events:none;z-index:1000;opacity:0;transition:width .2s ease,height .2s ease,margin .2s ease,background-color .2s ease,opacity .2s ease;will-change:transform}
#dot.hov{width:34px;height:34px;margin:-17px 0 0 -17px;background:rgba(17,17,16,.12);box-shadow:0 0 0 1.5px #111110}
@media (hover:hover) and (pointer:fine){html,body,*{cursor:none!important}}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:20px;flex-wrap:wrap}
.brand{font-family:var(--f-mono);font-weight:700;letter-spacing:.16em;font-size:20px}
.nav-r{display:flex;align-items:center;gap:clamp(16px,3vw,40px);flex-wrap:wrap}
.nav-r .lk{font-weight:500;font-size:17px}
.nav-r .lk:hover,.nav-r .lk[aria-current="page"]{color:var(--pf,var(--acc))}
.nav-r .lk[aria-current="page"]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1.5px}
.lang{display:flex;gap:4px}
.lang a{font-family:var(--f-mono);font-weight:500;font-size:13px;padding:6px 10px;border-radius:4px}
.lang a[aria-current="true"]{background:var(--ink);color:var(--bg)}
.lang a:not([aria-current="true"]):hover{background:var(--paper)}

/* landing hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,480px);gap:clamp(32px,6vw,80px);align-items:center;padding-block:clamp(40px,7vw,80px)}
.hero h1{font-size:clamp(40px,6.4vw,84px)}
.hero p{font-size:clamp(17px,1.7vw,22px);line-height:1.45;max-width:34em;margin-top:32px}
.link{display:inline-flex;gap:12px;align-items:center;font-weight:700;font-size:17px;padding-bottom:6px;border-bottom:1.5px solid currentColor;margin-top:32px}
.photo{margin:0;position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:var(--dark);border-radius:28px}
@media (max-width:860px){.photo{border-radius:22px}}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:contrast(1.04)}
.photo figcaption{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:12px;padding:18px 20px;color:var(--cream);background:linear-gradient(transparent,rgba(14,14,13,.7))}
.hero .links{display:flex;gap:28px;flex-wrap:wrap}
.hero h1 .sub{display:block;font-family:var(--f-serif);font-style:italic;font-weight:400;letter-spacing:-.01em;font-size:.46em;line-height:1.1;color:var(--acc);margin-top:.45em}
.hero{min-height:calc(100vh - 80px)}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}.photo{max-width:480px}}

/* projects grid */
.projects{padding-block:clamp(40px,6vw,72px) clamp(64px,9vw,110px)}
.projects h2{font-size:clamp(40px,6.4vw,84px);margin-bottom:40px}
.feat{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);background:var(--red);color:var(--cream);border:2px solid var(--ink);margin-bottom:24px;min-height:600px}
.feat .t{padding:clamp(24px,3.4vw,44px);display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.feat .meta{display:flex;justify-content:space-between;gap:16px}
.feat h3{font-size:clamp(56px,8.4vw,112px)}
.feat .h{font-weight:800;font-size:clamp(26px,3vw,38px);letter-spacing:-.04em;line-height:1.02;text-wrap:balance}
.feat .d{font-size:17px;line-height:1.45;margin-top:18px;max-width:34em}
.feat .im{background-size:cover;background-position:center;min-height:280px;transition:transform .6s ease}
.feat .imw{overflow:hidden;position:relative}
.feat:hover .im{transform:scale(1.04)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.card{display:flex;flex-direction:column;background:var(--dark);color:var(--cream);min-height:660px}
.card.lt{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px #C4C0B6}
.card .imw{aspect-ratio:628/320;overflow:hidden;background:#222}
.card .im{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.card:hover .im{transform:scale(1.05)}
.card .bar{height:6px}
.card .b{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:24px 32px 28px}
.card h3{font-size:clamp(30px,3.4vw,44px);font-weight:800;letter-spacing:-.045em;line-height:.96;margin:14px 0}
.card p{font-size:17px;line-height:1.45}
.card .meta{display:flex;justify-content:space-between;gap:12px}
.card .link{align-self:flex-start;margin-top:0}
@media (max-width:860px){.feat{grid-template-columns:minmax(0,1fr)}.feat .imw{order:-1;min-height:260px}.grid{grid-template-columns:minmax(0,1fr)}.card{min-height:0}}

/* about */
.about{background:#10100E;color:var(--cream)}
.about .wrap{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px;padding-block:clamp(72px,10vw,120px)}
.about h2{font-size:clamp(36px,5.6vw,80px)}
.about h2 em{font-family:var(--f-serif);font-style:italic;font-weight:400;color:var(--acc-l);letter-spacing:-.02em}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(24px,5vw,80px);margin-top:72px;padding-top:32px;border-top:1px solid #3A3A38;color:var(--soft);font-size:clamp(16px,1.5vw,20px);line-height:1.5}
@media (max-width:860px){.about .wrap{grid-template-columns:minmax(0,1fr)}.two{grid-template-columns:minmax(0,1fr);margin-top:40px}}

/* contact */
.contact{padding-block:clamp(64px,9vw,100px) 36px}
.ch{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:56px}
.ch h2{font-size:clamp(44px,8vw,104px);text-align:right;margin-left:auto}
.rows{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;gap:16px;align-items:center;padding-block:32px;border-top:1px solid var(--line)}
.row b{font-weight:800;font-size:clamp(34px,4.6vw,56px);letter-spacing:-.045em;line-height:1}
.row span{color:var(--muted);font-size:18px;overflow-wrap:anywhere}
.row .ar{font-size:36px;text-align:right}
a.row:hover b{color:var(--acc)}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:56px;padding-top:28px;border-top:1px solid var(--line)}
@media (max-width:640px){.row{grid-template-columns:minmax(0,1fr) 32px}.row span{grid-column:1;grid-row:2}.row .ar{grid-row:1;grid-column:2}.ch h2{text-align:left;margin-left:0}}

/* project page */
.ph{position:relative;background:#0E0E10;color:var(--cream);overflow:hidden;isolation:isolate}
.ph .bg,.ph .bg2{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2}
.ph .bg{filter:brightness(.34) saturate(.9)}
.ph .bg2{z-index:-1;-webkit-mask-image:radial-gradient(circle 260px at var(--mx,-999px) var(--my,-999px),#000 0%,rgba(0,0,0,.55) 45%,transparent 100%);mask-image:radial-gradient(circle 260px at var(--mx,-999px) var(--my,-999px),#000 0%,rgba(0,0,0,.55) 45%,transparent 100%);filter:brightness(.95) saturate(1.05)}
.ph .wrap{padding-block:clamp(40px,6vw,72px) clamp(56px,9vw,120px);display:flex;flex-direction:column;gap:clamp(36px,6vw,80px)}
.back{align-self:flex-start;display:inline-flex;gap:10px;align-items:center;color:var(--cream)}
.back:hover{color:var(--acc-l)}
.ph h1{font-size:clamp(48px,11vw,160px);line-height:.9;overflow-wrap:anywhere}
.ph .tag{color:var(--acc-l);margin-bottom:20px;display:block}
.ph .hd{font-weight:800;font-size:clamp(24px,3.2vw,44px);letter-spacing:-.04em;line-height:1.02;max-width:20em;margin-top:28px;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px 40px;padding-block:32px;border-bottom:1px solid var(--line)}
.facts div{display:flex;flex-direction:column;gap:8px}
.facts .mono{color:var(--muted)}
.facts b{font-weight:700;font-size:19px;line-height:1.25}
.body{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px;padding-block:clamp(48px,7vw,96px)}
.sec{max-width:46em;margin-bottom:56px}
.sec .mono{color:var(--acc);display:block;margin-bottom:14px}
.sec p{font-size:clamp(19px,2vw,26px);line-height:1.42;letter-spacing:-.01em}
.items{max-width:46em;border-top:1px solid var(--line)}
.items li{list-style:none;padding:18px 0;border-bottom:1px solid var(--line);font-size:18px;line-height:1.4;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px}
.items{margin:0;padding:0}
.items li::before{content:"↗";color:var(--acc);font-weight:700}
@media (max-width:860px){.body{grid-template-columns:minmax(0,1fr);gap:24px}}
.gal{padding-bottom:clamp(56px,8vw,100px)}
.gal .mono{color:var(--muted);display:block;margin-bottom:20px}
.cols{columns:3 300px;column-gap:16px}
.cols figure{margin:0 0 16px;break-inside:avoid;background:var(--paper);overflow:hidden}
.cols img{width:100%;height:auto;transition:transform .6s ease}
.cols figure:hover img{transform:scale(1.03)}
.next{background:var(--dark);color:var(--cream);position:relative;overflow:hidden}
.next .wrap{padding-block:clamp(56px,8vw,100px);display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}
.next .mono{color:var(--soft);display:block;margin-bottom:16px}
.next a.big{font-weight:800;font-size:clamp(40px,7vw,96px);letter-spacing:-.05em;line-height:.95;display:block}
.next a.big:hover{color:var(--acc-l)}
.next .all{font-weight:700;border-bottom:1.5px solid currentColor;padding-bottom:6px}
.pfoot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:28px}

/* stacked project cards */
.stack{display:flex;flex-direction:column;gap:56px;padding-bottom:40px}
.sc{position:sticky;top:calc(84px + var(--i)*26px);height:clamp(460px,72vh,620px);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);border-radius:28px;overflow:hidden;color:var(--ink);border:1px solid rgba(17,17,16,.12);box-shadow:0 24px 60px -24px rgba(17,17,16,.45);transform-origin:50% 0;transform:scale(calc(1 - var(--p,0)*.05));will-change:transform}
.sc.dk{color:var(--cream);border-color:rgba(255,255,255,.08)}
.sc .t{padding:clamp(24px,3.4vw,48px);display:flex;flex-direction:column;justify-content:space-between;gap:24px;min-width:0;opacity:calc(1 - var(--p,0)*.55)}
.sc .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.sc .num{font-size:clamp(72px,10vw,150px);line-height:.8}
.sc .tg{text-align:right;padding-top:8px;opacity:.8}
.sc h3{font-size:clamp(34px,4.6vw,68px);margin-bottom:14px}
.sc .h{font-weight:700;font-size:clamp(18px,1.8vw,24px);letter-spacing:-.03em;line-height:1.15}
.sc .d{font-size:16px;line-height:1.45;margin-top:12px;max-width:34em;opacity:.8;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sc .link{margin-top:20px;display:inline-flex}
.sc .imw{position:relative;overflow:hidden;background:#222;min-height:0}
.sc .im{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.sc:hover .im{transform:scale(1.05)}
.sc .bar{position:absolute;left:0;top:0;bottom:0;width:6px}
@media (max-width:860px){.sc{grid-template-columns:minmax(0,1fr);grid-template-rows:38% minmax(0,1fr);height:clamp(540px,80vh,680px);top:calc(76px + var(--i)*14px);border-radius:22px}.sc .imw{order:-1}.sc .bar{top:auto;right:0;width:auto;height:6px}.sc .num{font-size:64px}}


/* inner page header */
.phd{padding-block:clamp(40px,6vw,80px) clamp(28px,4vw,48px)}
.phd .mono{color:var(--acc);display:block;margin-bottom:18px}
.phd h1{font-size:clamp(44px,8vw,112px)}
.phd p{font-size:clamp(17px,1.6vw,21px);line-height:1.45;max-width:36em;margin-top:24px;color:var(--muted)}
.about{margin-top:0}
.cv{padding-block:clamp(56px,8vw,100px)}
.cvb{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px;padding-block:36px;border-top:1px solid var(--line)}
.cvb > .mono{color:var(--acc)}
.cvr{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) minmax(0,1fr);gap:8px 24px;padding-block:16px;border-bottom:1px solid var(--line);align-items:baseline}
.cvr:first-child{padding-top:0}
.cvr .y{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cvr b{font-weight:700;font-size:19px;letter-spacing:-.02em}
.cvr span{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips span{border:1px solid var(--ink);border-radius:999px;padding:8px 16px;font-weight:500}
@media (max-width:860px){.cvb{grid-template-columns:minmax(0,1fr);gap:20px}.cvr{grid-template-columns:minmax(0,1fr)}}

/* 3D keychain */
.k3{background:radial-gradient(120% 90% at 50% 40%,#F7F6F3 0%,var(--paper) 70%);border-radius:28px;margin-block:clamp(24px,4vw,48px) 0;position:relative;overflow:hidden}
.k3 .bar3{position:absolute;left:clamp(20px,3vw,36px);right:clamp(20px,3vw,36px);top:clamp(18px,2.6vw,30px);display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:2;flex-wrap:wrap}
.k3 .bar3 .mono{color:var(--acc)}
.k3 button{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--ink);border-radius:999px;padding:9px 16px;background:transparent;color:var(--ink)}
.k3 button:hover{background:var(--ink);color:var(--bg)}
.k3c{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.zm{display:flex;align-items:center;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.k3 .zm button{border:0;border-radius:0;width:44px;height:36px;padding:0;font-size:18px;font-family:var(--f-body);line-height:1}
.zm span{min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.k3 .hint{padding-inline:16px}
.k3 .hint{position:absolute;left:0;right:0;bottom:clamp(16px,2.4vw,28px);text-align:center;color:var(--muted);z-index:2}
.k3stage{height:clamp(480px,78vh,720px);display:grid;place-items:center;perspective:1500px;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.k3stage.drag{cursor:grabbing}
.k3obj{--h:min(500px,56vh,108vw);height:var(--h);width:calc(var(--h)*.7656);position:relative;transform-style:preserve-3d;will-change:transform}
.k3obj > *{position:absolute;inset:0;width:100%;height:100%}
.k3obj img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.k3f,.k3b{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.k3e{backface-visibility:visible}
.k3gl{position:absolute;inset:0;mix-blend-mode:soft-light;background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 65%);background-size:320% 100%;background-position:var(--shx,50%) 0;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.k3ring{position:absolute;inset:auto;width:30%;height:auto;aspect-ratio:1;transform-style:preserve-3d;pointer-events:none}
.k3ring svg{width:100%;height:100%;display:block;backface-visibility:visible}
.k3sh{position:absolute;left:50%;bottom:9%;width:min(320px,60vw);height:34px;border-radius:50%;background:radial-gradient(closest-side,rgba(14,14,13,.28),rgba(14,14,13,0));transform:translateX(-50%) scaleX(var(--shs,1));pointer-events:none}
@media (max-width:860px){.k3{border-radius:22px}}

/* before / after */
.ba{margin-block:clamp(32px,5vw,64px) 0;display:flex;flex-direction:column;gap:16px}
.ba .bal{color:var(--acc)}
.ba figure{margin:0;position:relative;overflow:hidden;border-radius:28px;background:var(--paper)}
.ba img{width:100%;height:100%;object-fit:cover;display:block}
.bab{aspect-ratio:1284/1067;max-height:78vh}
.bab img{filter:saturate(.92)}
.ba .tagb,.ba .taga{position:absolute;left:18px;top:18px;background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px}
.ba .taga{background:var(--ink);color:var(--bg)}
.baarrow{text-align:center;font-size:22px;color:var(--muted)}
.baa{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.baa figure{aspect-ratio:4/5}
@media (max-width:860px){.ba figure{border-radius:22px}.baa{grid-template-columns:minmax(0,1fr);}.baa figure{aspect-ratio:4/5}}

/* landing call to action */
.cta{padding-block:clamp(48px,8vw,96px) 36px}
.ctal{display:flex;flex-direction:column;gap:18px;padding-block:clamp(32px,5vw,56px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ctal .mono{color:var(--acc)}
.ctal h2{font-size:clamp(52px,10vw,148px);display:flex;align-items:baseline;gap:.2em;flex-wrap:wrap}
.ctal .ar{font-size:.6em;transition:transform .3s ease}
.ctal:hover h2{color:var(--acc)}
.ctal:hover .ar{transform:translate(8px,-8px)}
/* contact page */
.cform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:clamp(32px,6vw,80px);padding-bottom:clamp(64px,9vw,110px);align-items:start}
.cform form,.cdone{display:flex;flex-direction:column;gap:22px;min-width:0}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.fld{display:flex;flex-direction:column;gap:10px;min-width:0}
.fld .mono{color:var(--muted)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:18px;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;padding:10px 2px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
.fld select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 14px) 55%,calc(100% - 8px) 55%;background-size:6px 6px;background-repeat:no-repeat;cursor:pointer}
.fld textarea{resize:vertical;min-height:150px;line-height:1.5}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-bottom-color:var(--acc);box-shadow:0 1.5px 0 var(--acc)}
.fld .bad{border-bottom-color:#B3261E;box-shadow:0 1.5px 0 #B3261E}
.fact{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;gap:10px;align-items:center;font-weight:700;font-size:17px;background:var(--ink);color:var(--bg);border-radius:999px;padding:16px 26px;min-height:44px;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--acc)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.ferr{color:#B3261E}
.cdone h2{font-size:clamp(32px,4.4vw,56px)}
.cdone p{color:var(--muted);font-size:18px;line-height:1.5;max-width:40em}
.cdone pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:14px;line-height:1.6;background:var(--paper);border-radius:18px;padding:22px;margin:0;overflow-wrap:anywhere}
.cside{display:flex;flex-direction:column;gap:12px;padding:28px;border-radius:28px;background:var(--dark);color:var(--cream)}
.cside .mono{color:var(--soft)}
.cside b{font-size:18px;font-weight:700;overflow-wrap:anywhere;user-select:all}
@media (max-width:860px){.cform{grid-template-columns:minmax(0,1fr)}.frow{grid-template-columns:minmax(0,1fr)}.cside{border-radius:22px}}

/* next-page teaser + transition */
.tz{background:var(--dark);color:var(--cream);position:relative}
.tzin{min-height:40vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-block:clamp(48px,7vw,88px)}
.tzl{color:var(--soft)}
.tzt{font-size:clamp(40px,7vw,104px);display:flex;align-items:baseline;gap:.2em;flex-wrap:wrap;transition:color .3s,transform .35s cubic-bezier(.2,.7,.2,1);transform:translateY(calc(var(--tzp,0)*-10px))}
.tzt .ar{font-size:.42em;display:inline-block;opacity:calc(.45 + var(--tzp,0)*.55)}
.tzin:hover .tzt{color:var(--acc-l)}
.tzbar{display:block;height:1px;background:rgba(238,237,234,.14);overflow:hidden;max-width:360px}
.tzbar i{display:block;height:100%;width:calc(var(--tzp,0)*100%);background:var(--acc-l)}
.tzh{color:var(--soft);opacity:.7}
.tzf{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px;border-top:1px solid rgba(238,237,234,.12);color:var(--soft)}
.tzf a:hover{color:var(--acc-l)}
.nextpg{position:relative}
.nplab{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:28px;border-top:1px solid var(--line);color:var(--muted)}
.nplab span:first-child{color:var(--acc)}
.endfoot span:first-child{color:var(--ink);font-weight:700}
.nphead{pointer-events:none;min-height:100vh}
main.pg-in{animation:pgin .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes pgin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* page color follows the active project */
body,.nav{background:var(--pg,var(--bg));transition:background-color .7s ease,color .7s ease,border-color .7s ease}
.nav,.projects h2{color:var(--pf,var(--ink))}
.nav{border-bottom-color:var(--pl,var(--line))}
.lang a[aria-current="true"]{background:var(--pf,var(--ink));color:var(--pg,var(--bg))}
.sc{border-color:rgba(17,17,16,.18)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

const T = (v,l)=> Array.isArray(v) ? pick(v,l) : v;
const title = (p,l)=> T(p.title,l);

/* ---------- Render ---------- */
const $app = document.getElementById('app');
let state = {lang:'ca', page:'home'};
let pendingScroll = null;

function parseHash(){
  const h = (location.hash||'').replace('#','');
  const m = h.match(/^(es|ca|en)(?:-(.+))?$/);
  if(!m) return {lang:'ca',page:'home'};
  const slug = m[2];
  if(slug && (slug==='projects'||slug==='about'||slug==='contact'||P.some(p=>p.slug===slug))) return {lang:m[1],page:slug};
  return {lang:m[1],page:'home'};
}
const href = (lang,page)=> '#'+lang+(page&&page!=='home'?'-'+page:'');

function navHTML(l,page){
  const cur=(pg)=> (pg===page || (pg==='projects' && P.some(p=>p.slug===page))) ? ' aria-current="page"' : '';
  const lk=(i,id)=> `<a class="lk" href="${href(l,id)}"${cur(id)}>${pick(UI.nav[i],l)}</a>`;
  const sw = ['ca','es','en'].map(x=>`<a href="${href(x,page)}" aria-current="${x===l}" lang="${x}">${x.toUpperCase()}</a>`).join('');
  return `<header class="nav"><div class="wrap"><a class="brand" href="${href(l,'home')}">POL ESTEBA</a>
  <nav class="nav-r">${lk(0,'projects')}${lk(1,'about')}${lk(2,'contact')}<div class="lang" role="group" aria-label="Language">${sw}</div></nav></div></header>`;
}
const ctaHTML=(l)=>`<section class="wrap cta"><a class="ctal" href="${href(l,'contact')}"><h2 class="display">${pick(UI.ctaH,l)} <span class="ar">↗</span></h2></a>
    <div class="foot mono"><span style="font-weight:700">POL ESTEBA</span><span>Vilafant, Girona</span><span>© 2026</span></div></section>`;
function contactHTML(l){
  const opts=pick(UI.fWhyO,l).map((o,i)=>`<option${i===1?' selected':''}>${o}</option>`).join('');
  return `<main><section class="wrap phd"><span class="mono">/ ${pick(UI.contactLabel,l)}</span><h1 class="display">${pick(UI.contactH,l)}</h1><p>${pick(UI.fIntro,l)}</p></section>
  <section class="wrap cform">
    <form id="cf" novalidate>
      <div class="frow"><label class="fld"><span class="mono">${pick(UI.fName,l)} *</span><input name="name" autocomplete="given-name" required maxlength="120"></label>
      <label class="fld"><span class="mono">${pick(UI.fLast,l)} *</span><input name="surname" autocomplete="family-name" required maxlength="160"></label></div>
      <div class="frow"><label class="fld"><span class="mono">${pick(UI.fEmail,l)} *</span><input name="email" type="email" autocomplete="email" required maxlength="160"></label>
      <label class="fld"><span class="mono">${pick(UI.fTel,l)}</span><input name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="30"></label></div>
      <div class="frow"><label class="fld"><span class="mono">${pick(UI.fCo,l)}</span><input name="company" autocomplete="organization" maxlength="120"></label>
      <label class="fld"><span class="mono">${pick(UI.fWhy,l)}</span><select name="why">${opts}</select></label></div>
      <label class="fld"><span class="mono">${pick(UI.fMsg,l)} *</span><textarea name="msg" rows="6" required maxlength="3000" placeholder="${pick(UI.fMsgPh,l)}"></textarea></label>
      <div class="fact"><button type="submit" class="btn">${pick(UI.fSend,l)} <span>→</span></button><span class="ferr mono" id="cferr" role="alert"></span></div>
    </form>
    <div class="cdone" id="cdone" hidden>
      <h2 class="display">${pick(UI.fReady,l)}</h2><p>${pick(UI.fReadyP,l)}</p>
      <pre id="cmsg"></pre>

/* ---------- 3D keychain ---------- */
let K3=null;
function initK3(){
  const st=document.getElementById('k3'); if(!st){K3=null;return;}
  const obj=document.getElementById('k3obj'), gl=document.getElementById('k3gl'), sh=document.getElementById('k3sh');
  gl.style.webkitMaskImage=gl.style.maskImage=`url(${IMG.kc_front})`;
  const pct=document.getElementById('k3pct');
  const s={st,obj,gl,sh,pct,ry:-28,rx:-6,vy:0,vx:0,drag:false,last:0,target:null,lx:0,ly:0,z:1,zt:1,pts:new Map(),pinch:null};
  const clampZ=v=>Math.max(.6,Math.min(2.4,v));
  const setZ=v=>{s.zt=clampZ(v);s.last=performance.now();};
  const dist=()=>{const p=[...s.pts.values()];return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);};
  st.addEventListener('pointerdown',e=>{s.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});st.setPointerCapture(e.pointerId);s.target=null;s.vy=s.vx=0;
    if(s.pts.size===2){s.drag=false;s.pinch={d:dist(),z:s.zt};}else{s.drag=true;s.lx=e.clientX;s.ly=e.clientY;st.classList.add('drag');}});
  st.addEventListener('pointermove',e=>{if(!s.pts.has(e.pointerId))return;s.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(s.pinch&&s.pts.size===2){setZ(s.pinch.z*dist()/s.pinch.d);return;}
    if(!s.drag)return;const dx=e.clientX-s.lx,dy=e.clientY-s.ly;s.lx=e.clientX;s.ly=e.clientY;s.vy=dx*.45;s.vx=-dy*.3;s.ry+=s.vy;s.rx=Math.max(-35,Math.min(35,s.rx+s.vx));s.last=performance.now();});
  const up=e=>{s.pts.delete(e.pointerId);if(s.pts.size<2)s.pinch=null;
    if(s.pts.size===1){const p=[...s.pts.values()][0];s.lx=p.x;s.ly=p.y;s.drag=true;s.vy=s.vx=0;return;}
    s.drag=false;st.classList.remove('drag');s.last=performance.now();};
  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  st.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();setZ(s.zt*Math.exp(-e.deltaY*.01));},{passive:false});
  st.addEventListener('dblclick',()=>setZ(s.zt>1.3?1:1.8));
  document.getElementById('k3in').addEventListener('click',()=>setZ(s.zt*1.25));
  document.getElementById('k3out').addEventListener('click',()=>setZ(s.zt/1.25));
  document.getElementById('k3flip').addEventListener('click',()=>{s.target=Math.round(s.ry/180)*180+180;s.last=performance.now();});
  K3=s;
}
function stepK3(){
  const s=K3; if(!s||!s.obj.isConnected) return;
  const now=performance.now();
  if(!s.drag){
    if(s.target!==null){s.ry+=(s.target-s.ry)*.09; if(Math.abs(s.target-s.ry)<.2){s.ry=s.target;s.target=null;}}
    else if(Math.abs(s.vy)>.05||Math.abs(s.vx)>.05){s.ry+=s.vy;s.rx=Math.max(-35,Math.min(35,s.rx+s.vx));s.vy*=.94;s.vx*=.9;}
    else if(!reduce&&now-s.last>2200){s.ry+=.35;s.rx+=(-6+Math.sin(now/1400)*5-s.rx)*.03;}
  }
  s.z+=(s.zt-s.z)*.18; const zp=Math.round(s.zt*100)+'%'; if(s.pct.textContent!==zp) s.pct.textContent=zp;
  s.obj.style.transform=`scale(${s.z.toFixed(3)}) rotateX(${s.rx.toFixed(2)}deg) rotateY(${s.ry.toFixed(2)}deg) translateY(${(Math.sin(now/900)*6).toFixed(1)}px)`;
  const a=((s.ry%360)+360)%360; s.gl.style.setProperty('--shx',(100-((a+60)%360)/360*100).toFixed(1)+'%');
  s.sh.style.setProperty('--shs',((0.55+0.45*Math.abs(Math.cos(a*Math.PI/180)))*Math.min(s.z,1.6)).toFixed(3));
}
